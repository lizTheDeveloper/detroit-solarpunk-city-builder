# Weekly civic data updater for Solarpunk Detroit.
#
# Uses the hybrid approach defined in scripts/update-civic-data.py:
#   1. Wikidata SPARQL  — Mayor of Detroit (structured: Q14916519)
#   2. Wikipedia REST API — 2025 election results
#   3. detroitmi.gov scrape — council member bios
#
# If data has changed (new mayor, new council members), opens a PR
# with the generated files. You review and merge.
#
# Schedule: Mondays at 09:00 UTC.

name: Update Civic Data

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC
  workflow_dispatch:       # Manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Give the GITHUB_TOKEN write access so it can create branches & PRs
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Check for stale data
        id: stale
        run: |
          python scripts/update-civic-data.py --check
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Apply updates if stale
        if: steps.stale.outputs.exitcode == '1'
        run: |
          python scripts/update-civic-data.py --apply

      - name: Check what changed
        if: steps.stale.outputs.exitcode == '1'
        id: changes
        run: |
          git diff --stat
          echo "has_changes=$(git status --porcelain | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "diff=$(git diff --stat | head -20)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.stale.outputs.exitcode == '1' && steps.changes.outputs.has_changes != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(civic-data): auto-update mayor and council bios from live sources"
          title: "chore(civic-data): auto-update from detroitmi.gov and Wikidata"
          body: |
            ️ **Auto-generated civic data update**

            This PR was opened by the weekly civic data updater.

            **Sources:**
            - Wikidata SPARQL (Mayor of Detroit: Q14916519)
            - Wikipedia: 2025 Detroit mayoral election results
            - detroitmi.gov profile pages (council bios)

            **Changes detected:** See the diff for updated `council-members.ts` and `detroit.ts`.

            Please review and merge if the changes look correct. If the city website
            structure has changed and scraping is broken, the script logs warnings —
            check the workflow run logs.

            _Generated by `scripts/update-civic-data.py`_
          branch: civic-data/update
          base: main
          delete-branch: true
          reviewers: annhoward
